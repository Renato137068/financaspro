name: Saúde do app

# Painel de saúde (etapa 4 do roadmap): todo dia lê o schema `saude` do
# Supabase (scripts/saude-relatorio.cjs), publica o relatório no resumo do
# job e abre uma issue por alerta: versão nova pior que a anterior, versão
# acima do teto de erros, avisos de uso que pararam de chegar ou erro novo
# que já se repetiu. Sem o segredo, o job só avisa e sai verde.
#
# Segredo do repositório (Settings → Secrets → Actions):
#   SAUDE_DATABASE_URL — conexão direta ao Postgres do Supabase com um papel
#   que só lê o schema saude (docs/observabilidade/painel-saude.md).

on:
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: saude
  cancel-in-progress: true

jobs:
  relatorio:
    name: Relatório e alerta
    runs-on: ubuntu-latest
    env:
      SAUDE_DATABASE_URL: ${{ secrets.SAUDE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Segredo configurado?
        id: segredo
        run: |
          if [ -z "$SAUDE_DATABASE_URL" ]; then
            echo "::notice::SAUDE_DATABASE_URL não configurado — painel de saúde pulado (docs/observabilidade/painel-saude.md)"
            echo "tem=false" >> "$GITHUB_OUTPUT"
          else
            echo "tem=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.segredo.outputs.tem == 'true'
        with:
          node-version: 22.x

      # Só node e psql (já no runner): o script não tem dependência do npm.
      - name: Relatório
        id: saude
        if: steps.segredo.outputs.tem == 'true'
        run: node scripts/saude-relatorio.cjs --saida relatorio.md --alertas alertas.txt

      # Uma issue por alerta (o título identifica): se já existe aberta,
      # comenta em vez de duplicar. O título é comparado com jq --arg, nunca
      # interpolado em código: ele pode trazer a mensagem de um erro.
      - name: Abrir ou atualizar as issues dos alertas
        if: steps.saude.outputs.alerta == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while IFS= read -r TITULO; do
            [ -z "$TITULO" ] && continue
            NUM=$(gh issue list --state open --limit 200 --json number,title \
              | jq -r --arg t "$TITULO" '.[] | select(.title == $t) | .number' | head -n1)
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body-file relatorio.md
            else
              gh issue create --title "$TITULO" --body-file relatorio.md
            fi
          done < alertas.txt
