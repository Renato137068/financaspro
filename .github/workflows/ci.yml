name: CI - FinançasPro

on:
  push:
    # Branches de trabalho tambem disparam a esteira.
    #
    # Antes so main/master e PRs para elas rodavam. O efeito pratico era que
    # uma branch de feature podia acumular semanas de trabalho com o CI
    # vermelho sem ninguem ver — e o vermelho so aparecia na hora de abrir o
    # PR, quando desfazer ja custa caro. Rodar no push da branch move a
    # descoberta para o dia em que o problema nasce.
    branches: [main, master, 'feat/**', 'fix/**', 'chore/**', 'refactor/**']
  pull_request:
    branches: [main, master]

# Só leitura: nenhum job daqui publica nada. Sem isto, o token herdava a
# permissão padrão do repositório (que pode ser escrita).
permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: financaspro
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: financaspro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # lint:changed compara com a base do PR — precisa do historico.
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Lista de globais do frontend em dia (no-undef)
        run: npm run check:globals

      - name: Telas geradas em dia (telas/ -> js/telas/)
        run: npm run check:telas

      - name: Lint estrito no codigo alterado
        # Congela a divida existente e exige zero avisos no que o PR toca.
        run: npm run lint:changed

      - name: Auditoria de dependencias
        run: npm audit --audit-level=high

      - name: Orcamento de bundle
        run: npm run check:bundle

      - name: Contraste WCAG dos tokens de cor
        run: npm run check:contrast

      - name: Divida de tokens no CSS
        run: npm run check:css

      - name: Wiring de monetizacao (estatico)
        run: npm run check:billing

      - name: Gate pre-beta (estatico)
        # Só checagens locais — rede/secrets ficam para o operador com FP_PRE_BETA_STATIC unset.
        run: npm run check:pre-beta:static
        env:
          FP_PRE_BETA_STATIC: '1'
          FP_SKIP_CLI: '1'

      - name: Testes
        run: npm run test:ci

      - name: Instalar cliente PostgreSQL + pgTAP (RLS/quota/MFA)
        if: matrix.node-version == '22.x'
        # postgres:16-alpine (service) não traz a extensão pgtap; instalamos o
        # pacote no runner só pelo pgtap--<versão>.sql, que test-supabase-pgtap.cjs
        # carrega no banco via psql -f (não precisa de CREATE EXTENSION no servidor).
        run: sudo apt-get update && sudo apt-get install -y postgresql-client postgresql-16-pgtap

      - name: Testes pgTAP Supabase (RLS, quota, MFA)
        if: matrix.node-version == '22.x'
        run: npm run test:db:ci
        env:
          INTEGRATION_TEST_DATABASE_URL: postgresql://financaspro:testpass@localhost:5432/financaspro_test

      - name: Instalar Chromium (Playwright)
        if: matrix.node-version == '22.x'
        run: npx playwright install chromium

      - name: Smoke boot dist (pageerror)
        if: matrix.node-version == '22.x'
        run: npm run test:e2e:smoke

      - name: Testes E2E
        if: matrix.node-version == '22.x'
        run: npm run test:e2e
        env:
          E2E_SUPABASE: ${{ secrets.E2E_SUPABASE }}
          E2E_EMAIL: ${{ secrets.E2E_SUPABASE_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_SUPABASE_PASSWORD }}
          E2E_SUPABASE_MFA_EMAIL: ${{ secrets.E2E_SUPABASE_MFA_EMAIL }}
          E2E_SUPABASE_MFA_PASSWORD: ${{ secrets.E2E_SUPABASE_MFA_PASSWORD }}
          E2E_TOTP_SECRET: ${{ secrets.E2E_SUPABASE_TOTP_SECRET }}

      - name: Gerar relatorio de cobertura
        if: matrix.node-version == '22.x'
        run: npm run test:coverage

      - name: Upload relatorio de cobertura
        if: matrix.node-version == '22.x'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # Edge Functions (a cobrança que roda em produção, ADR 0004) executadas de
  # verdade no Deno, com banco, Stripe e Google falsos (npm run test:edge).
  edge:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.x

      - name: Testes das Edge Functions
        run: node scripts/test-edge.cjs

      - name: Checagem de tipos das Edge Functions
        run: node scripts/test-edge.cjs --tipos

  # O projeto Android só compilava no workflow de release, na hora de publicar:
  # um plugin novo, uma versão de biblioteca ou um erro no Java aparecia ali,
  # com a versão pronta. Aqui ele compila (debug, sem assinatura) a cada PR.
  android:
    name: Android (compila)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # O gradle-wrapper.jar roda com acesso a tudo no job (no release, à
      # keystore): confere que é o jar oficial do Gradle.
      - name: Gradle wrapper oficial
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - run: npm ci

      - name: Build web e sync com o Android
        run: npm run android:sync

      - name: assembleDebug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [test, edge, android]
    if: always()
    steps:
      - name: Verificar resultado dos testes
        run: |
          if [ "${{ needs.test.result }}" != "success" ] || [ "${{ needs.edge.result }}" != "success" ] || [ "${{ needs.android.result }}" != "success" ]; then
            echo "Testes falharam - pipeline bloqueado"
            exit 1
          fi
          echo "Todos os testes passaram"
